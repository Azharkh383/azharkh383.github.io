<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Modern dark saloon car at sunset</title><desc id="desc">A clean vector illustration of a dark blue saloon car on a road, with warm sunset light, hills and soft glass-like highlights.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#f8e7d8"/><stop offset=".52" stop-color="#e8bda4"/><stop offset="1" stop-color="#9d9db7"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff9d7"/><stop offset="1" stop-color="#f5c98b" stop-opacity="0"/></radialGradient>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#59616f"/><stop offset="1" stop-color="#222a38"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#51677d"/><stop offset=".42" stop-color="#24394f"/><stop offset="1" stop-color="#111d2c"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c6e1e7"/><stop offset="1" stop-color="#58778b"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
